<!DOCTYPE html>
<html>
<head>
    <title>Moderation - Elden Builds</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body { background: #0d1117; }
        .navbar { background: #1a1a2e !important; }
        .navbar-brand, .nav-link { color: #ffd700 !important; }
        .card { background: #1a1a2e; color: #eee; margin-bottom: 20px; }
        .btn-approve { background: #28a745; color: white; }
        .btn-reject { background: #dc3545; color: white; }
        .pending-badge { background: #ffc107; color: #000; }
        .build-img { max-height: 150px; object-fit: cover; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">⚔️ Elden Builds</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/builds">All Builds</a></li>
                <li class="nav-item"><a class="nav-link" href="/moderation">Moderation</a></li>
                <li class="nav-item"><a class="nav-link" href="/my-builds">My Builds</a></li>
                <li class="nav-item"><button class="btn btn-danger btn-sm" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="text-center mb-4" style="color: #ffd700;">⚔️ Moderation Panel ⚔️</h1>
    <div id="buildsGrid" class="row"></div>
</div>

<script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
<script src="/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = window.location.origin;

    function getToken() {
        return localStorage.getItem('accessToken');
    }

    function checkAdmin() {
        const token = getToken();
        if (!token) {
            window.location.href = '/';
            return false;
        }
        // Здесь можно проверить роль пользователя через /api/users/me
        return true;
    }

    function loadPendingBuilds() {
        const token = getToken();

        $('#buildsGrid').html('<div class="col-12 text-center text-info">Loading pending builds...</div>');

        $.ajax({
            url: API_URL + '/api/builds/pending',
            type: 'GET',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function(builds) {
                const grid = $('#buildsGrid');
                grid.empty();

                if (!builds || builds.length === 0) {
                    grid.html('<div class="col-12 text-center" style="color:#888;">No pending builds for moderation</div>');
                    return;
                }

                builds.forEach(build => {
                    let previewUrl = build.preview;
                    if (!previewUrl || previewUrl === 'null' || previewUrl === '') {
                        previewUrl = 'https://via.placeholder.com/300x200?text=No+Image';
                    }

                    grid.append(`
                        <div class="col-md-6">
                            <div class="card">
                                <div class="row g-0">
                                    <div class="col-md-4">
                                        <img src="${previewUrl}" class="img-fluid rounded-start build-img" alt="${build.name}">
                                    </div>
                                    <div class="col-md-8">
                                        <div class="card-body">
                                            <h5 class="card-title">${build.name || 'Unnamed'}</h5>
                                            <p class="card-text">${build.description || 'No description'}</p>
                                            <p><strong>Author:</strong> ${build.owner?.email || 'Unknown'}</p>
                                            <p><strong>Equipment:</strong><br>
                                            Right: ${build.right || '-'}<br>
                                            Left: ${build.left || '-'}<br>
                                            Helmet: ${build.helmet || '-'}<br>
                                            Armor: ${build.armor || '-'}<br>
                                            Gloves: ${build.gloves || '-'}<br>
                                            Trousers: ${build.trousers || '-'}</p>
                                            <div>
                                                <button class="btn btn-approve btn-sm" onclick="approveBuild(${build.id})">✓ Approve</button>
                                                <button class="btn btn-reject btn-sm" onclick="rejectBuild(${build.id})">✗ Reject</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `);
                });
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    alert('Access denied. Admin only.');
                    window.location.href = '/';
                } else {
                    $('#buildsGrid').html('<div class="col-12 text-center text-danger">Error loading builds</div>');
                }
            }
        });
    }

    function approveBuild(id) {
        const token = getToken();

        $.ajax({
            url: API_URL + '/api/builds/' + id + '/approve',
            type: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function() {
                alert('Build approved!');
                loadPendingBuilds();
            },
            error: function(xhr) {
                alert('Error: ' + (xhr.responseJSON?.message || xhr.responseText));
            }
        });
    }

    function rejectBuild(id) {
        const token = getToken();

        $.ajax({
            url: API_URL + '/api/builds/' + id + '/reject',
            type: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function() {
                alert('Build rejected!');
                loadPendingBuilds();
            },
            error: function(xhr) {
                alert('Error: ' + (xhr.responseJSON?.message || xhr.responseText));
            }
        });
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/';
    }

    if (checkAdmin()) {
        loadPendingBuilds();
    }
</script>
</body>
</html>
