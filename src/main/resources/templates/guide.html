<!DOCTYPE html>
<html>
<head>
    <title>Build Guide</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0d1117; }
        .navbar { background: #1a1a2e !important; padding: 10px 0; }
        .navbar-brand { color: #ffd700 !important; font-size: 1.5rem; font-weight: bold; }
        .btn-back { background: #ff6b35; color: white; border: none; padding: 5px 15px; border-radius: 5px; }
        .btn-back:hover { background: #ff8c5a; }
        .build-preview { background: #1a1a2e; border-radius: 10px; padding: 20px; margin-bottom: 20px; position: relative; }
        .build-preview img { width: 100%; border-radius: 10px; margin-bottom: 15px; }
        .stats-list { list-style: none; padding: 0; }
        .stats-list li { padding: 8px 0; border-bottom: 1px solid #444; color: #eee; }
        .stats-list li strong { color: #ffd700; width: 120px; display: inline-block; }
        .guide-section { background: #1a1a2e; border-radius: 10px; padding: 20px; min-height: 500px; }
        .guide-content { color: #eee; line-height: 1.6; }
        .guide-content h1, .guide-content h2, .guide-content h3 { color: #ffd700; margin-top: 20px; }
        .category-badge { background: #ff6b35; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .level-badge { background: #ff6b35; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .weapon-badge { background: #4a4a8a; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .loading { text-align: center; color: #ffd700; font-size: 1.2rem; margin-top: 50px; }
        .btn-edit { background: #ffc107; color: #000; border: none; padding: 8px 20px; border-radius: 5px; margin-top: 20px; }
        .btn-edit:hover { background: #ffcd39; }

        .scaling-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 15px 0;
            padding: 15px;
            background: #2c2c3e;
            border-radius: 10px;
        }
        /* Добавьте в конец существующих стилей */

        /* Текст в секциях гайда - белый */
        .guide-text-block {
            color: #ffffff !important;
            background: #2c2c3e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .guide-text-block p,
        .guide-text-block span,
        .guide-text-block div {
            color: #ffffff !important;
        }

        /* Заголовки в гайде */
        .guide-content h1,
        .guide-content h2,
        .guide-content h3,
        .guide-content h4 {
            color: #ffd700 !important;
        }

        /* Обычный текст в гайде */
        .guide-content p,
        .guide-content li,
        .guide-content span {
            color: #ffffff !important;
        }

        /* Для всего контента гайда */
        .guide-content * {
            color: #ffffff;
        }

        /* Специфично для текстовых блоков */
        .guide-text-block {
            color: #ffffff;
        }

        /* Ссылки в гайде */
        .guide-content a {
            color: #ff6b35;
        }

        .guide-content a:hover {
            color: #ff8c5a;
        }
        .scaling-item {
            text-align: center;
            min-width: 70px;
        }
        .scaling-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }
        .scaling-label {
            font-size: 11px;
            color: #eee;
        }
        .scaling-value {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }
        .scaling-value.S { color: #ff6b35; text-shadow: 0 0 5px rgba(255,107,53,0.5); }
        .scaling-value.A { color: #ff8c5a; }
        .scaling-value.B { color: #ffd700; }

        .like-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #888;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        .like-btn:hover {
            background: #ff6b35;
            color: white;
            transform: scale(1.05);
        }
        .like-btn.liked {
            background: #ff6b35;
            color: white;
        }
        .like-btn.liked:hover {
            background: #dc3545;
        }
        .like-count {
            font-weight: bold;
            font-size: 14px;
        }

        .comments-section {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .comment {
            background: #2c2c3e;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .comment-author {
            color: #ffd700;
            font-weight: bold;
            font-size: 14px;
        }
        .comment-date {
            color: #888;
            font-size: 11px;
        }
        .comment-text {
            color: #eee;
            margin-top: 5px;
            font-size: 14px;
            line-height: 1.4;
        }
        .comment-actions {
            margin-top: 8px;
            display: flex;
            gap: 10px;
        }
        .comment-like-btn, .comment-delete-btn {
            background: none;
            border: none;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }
        .comment-like-btn { color: #888; }
        .comment-like-btn:hover { color: #ff6b35; }
        .comment-like-btn.liked { color: #ff6b35; }
        .comment-delete-btn { color: #dc3545; }
        .comment-delete-btn:hover { color: #c82333; }

        .comment-input {
            background: #2c2c3e;
            border: 1px solid #444;
            color: #eee;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            resize: vertical;
        }
        .comment-input:focus {
            outline: none;
            border-color: #ff6b35;
        }
        .btn-comment {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
        .btn-comment:hover { background: #ff8c5a; }
        .no-comments { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">⚔️ Elden Builds</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a href="/" class="btn-back">← Back to Builds</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4" id="buildDetail">
    <div class="loading">Loading build...</div>
</div>

<!-- Секция комментариев -->
<div id="commentsContainer" class="comments-section" style="margin-top: 20px;">
    <h4 style="color: #ffd700;">💬 Комментарии (<span id="commentsCount">0</span>)</h4>
    <div id="commentsList"></div>

    <div id="commentFormSection" class="mt-3">
        <textarea id="commentContent" class="comment-input" rows="3" placeholder="Напишите комментарий..."></textarea>
        <button class="btn-comment" onclick="addComment()">✏️ Отправить</button>
    </div>
    <div id="loginToComment" class="text-center mt-3" style="display: none;">
        <a href="#" onclick="showLoginModal()">Войдите</a>, чтобы оставить комментарий
    </div>
</div>

<script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
<script src="/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = window.location.origin;
    let buildId = null;
    let currentBuild = null;

    function getToken() {
        return localStorage.getItem('accessToken');
    }

    function isTokenValid() {
        const token = getToken();
        const expiry = localStorage.getItem('tokenExpiry');
        if (!token) return false;
        if (!expiry) return true;
        return new Date().getTime() < parseInt(expiry);
    }

    function isOwner(buildOwnerEmail) {
        const userEmail = localStorage.getItem('userEmail');
        return userEmail && buildOwnerEmail === userEmail;
    }

    function isCommentOwner(commentAuthorEmail) {
        const userEmail = localStorage.getItem('userEmail');
        return userEmail && commentAuthorEmail === userEmail;
    }

    function escapeHtml(text) {
        if (!text) return text;
        return String(text).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderScaling(build) {
        const scalings = [
            { key: 'strengthScaling', icon: '💪', name: 'Сила' },
            { key: 'dexterityScaling', icon: '🏹', name: 'Ловкость' },
            { key: 'intelligenceScaling', icon: '🔮', name: 'Интеллект' },
            { key: 'faithScaling', icon: '✨', name: 'Вера' },
            { key: 'arcaneScaling', icon: '🩸', name: 'Аркана' }
        ];

        let html = '<div class="scaling-grid">';
        for (let s of scalings) {
            const value = build[s.key];
            if (value && value !== 'NOT') {
                html += `
                    <div class="scaling-item">
                        <span class="scaling-icon">${s.icon}</span>
                        <div class="scaling-label">${s.name}</div>
                        <div class="scaling-value ${value}">${value}</div>
                    </div>
                `;
            }
        }
        html += '</div>';
        return html;
    }

    function renderGuideContent(content) {
        if (!content) {
            return '<p class="text-muted">No guide written yet. Click "Edit Guide" to add detailed instructions, boss strategies, and tips!</p>';
        }

        let blocks;
        try {
            blocks = JSON.parse(content);
        } catch(e) {
            return `<div class="guide-content">${escapeHtml(content)}</div>`;
        }

        if (!blocks || blocks.length === 0) {
            return '<p class="text-muted">No guide written yet.</p>';
        }

        let html = '';
        blocks.forEach((block) => {
            if (block.type === 'text') {
                html += `<div class="guide-text-block" style="margin-bottom: 20px; line-height: 1.6; padding: 15px; background: #2c2c3e; border-radius: 8px;">${escapeHtml(block.content || '').replace(/\n/g, '<br>')}</div>`;
            } else if (block.type === 'image' && block.url) {
                html += `<div class="guide-image-block" style="margin: 20px 0; text-align: center;">
                        <img src="${block.url}" style="max-width: 100%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" onerror="this.src='https://via.placeholder.com/400x300?text=Image+not+found'">
                    </div>`;
            }
        });
        return html;
    }

    function toggleLike() {
        const token = getToken();
        if (!token || !isTokenValid()) {
            alert('Please login to like builds');
            return;
        }

        $.ajax({
            url: API_URL + '/api/likes/' + buildId + '/toggle',
            type: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function(response) {
                const $btn = $('.like-btn');
                if (response.liked) {
                    $btn.addClass('liked');
                    $btn.html('❤️ <span class="like-count">' + response.likesCount + '</span>');
                } else {
                    $btn.removeClass('liked');
                    $btn.html('🤍 <span class="like-count">' + response.likesCount + '</span>');
                }
                currentBuild.likesCount = response.likesCount;
                currentBuild.likedByCurrentUser = response.liked;
            },
            error: function(xhr) {
                if (xhr.status === 401) {
                    alert('Please login again');
                } else {
                    alert('Failed to toggle like');
                }
            }
        });
    }

    // ========== КОММЕНТАРИИ ==========
    function loadComments() {
        console.log('Loading comments for buildId:', buildId);

        $.ajax({
            url: `${API_URL}/api/builds/${buildId}/comments?page=0&size=20`,
            type: 'GET',
            success: function(response) {
                console.log('Comments loaded:', response);
                displayComments(response.content);
                $('#commentsCount').text(response.totalElements);

                const token = getToken();
                if (token && isTokenValid()) {
                    $('#commentFormSection').show();
                    $('#loginToComment').hide();
                } else {
                    $('#commentFormSection').hide();
                    $('#loginToComment').show();
                }
            },
            error: function(xhr) {
                console.error('Error loading comments:', xhr);
                $('#commentsList').html('<div class="no-comments">❌ Error loading comments</div>');
            }
        });
    }

    function displayComments(comments) {
        const container = $('#commentsList');
        container.empty();

        console.log('Displaying comments, count:', comments.length);

        if (!comments || comments.length === 0) {
            container.html('<div class="no-comments">💭 No comments yet. Be the first!</div>');
            return;
        }

        comments.forEach(comment => {
            const isOwnerFlag = isCommentOwner(comment.author.email);
            const deleteBtn = isOwnerFlag ?
                `<button class="comment-delete-btn" onclick="deleteComment(${comment.id})">🗑️</button>` : '';

            const commentHtml = `
                <div class="comment" id="comment-${comment.id}">
                    <div class="comment-header">
                        <span class="comment-author">✍️ ${escapeHtml(comment.author.email)}</span>
                        <span class="comment-date">📅 ${new Date(comment.createdAt).toLocaleString()}</span>
                    </div>
                    <div class="comment-text">💬 ${escapeHtml(comment.content)}</div>
                    <div class="comment-actions">
                        <button class="comment-like-btn" onclick="likeComment(${comment.id})">❤️ ${comment.likesCount || 0}</button>
                        ${deleteBtn}
                    </div>
                </div>
            `;
            container.append(commentHtml);
        });
    }

    function addComment() {
        const content = $('#commentContent').val();
        if (!content.trim()) {
            alert('Напишите комментарий');
            return;
        }

        const token = getToken();
        if (!token || !isTokenValid()) {
            alert('Войдите чтобы комментировать');
            showLoginModal();
            return;
        }

        $.ajax({
            url: `${API_URL}/api/builds/${buildId}/comments`,
            type: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            data: JSON.stringify({ content: content.trim() }),
            success: function() {
                $('#commentContent').val('');
                loadComments();
            },
            error: function(xhr) {
                console.error('Error:', xhr);
                if (xhr.status === 401) {
                    alert('Пожалуйста, войдите снова');
                    localStorage.clear();
                    location.reload();
                } else {
                    alert('Ошибка: ' + (xhr.responseJSON?.message || 'Не удалось отправить комментарий'));
                }
            }
        });
    }

    function deleteComment(commentId) {
        if (!confirm('Delete this comment?')) return;

        const token = getToken();
        $.ajax({
            url: `${API_URL}/api/builds/${buildId}/comments/${commentId}`,
            type: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function() {
                loadComments();
            },
            error: function(xhr) {
                alert('Error: ' + (xhr.responseJSON?.message || 'Failed to delete comment'));
            }
        });
    }

    function likeComment(commentId) {
        const token = getToken();
        if (!token || !isTokenValid()) {
            alert('Please login to like comments');
            return;
        }

        $.ajax({
            url: `${API_URL}/api/builds/${buildId}/comments/${commentId}/like`,
            type: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            success: function() {
                loadComments();
            },
            error: function(xhr) {
                console.error('Error liking comment:', xhr);
            }
        });
    }

    function showLoginModal() {
        $('#loginEmail, #loginPassword').val('');
        $('#loginMessage').hide();
        $('#loginModal').modal('show');
    }

    // ========== ЗАГРУЗКА БИЛДА ==========
    function loadBuild() {
        const path = window.location.pathname;
        const parts = path.split('/');
        buildId = parts[parts.length - 1];

        console.log('Loading build ID:', buildId);

        if (!buildId || isNaN(buildId)) {
            $('#buildDetail').html('<div class="alert alert-danger">Invalid build ID</div>');
            return;
        }

        const token = getToken();
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};

        $.ajax({
            url: API_URL + '/api/builds/' + buildId,
            type: 'GET',
            headers: headers,
            success: function(build) {
                console.log('Build loaded:', build);
                currentBuild = build;
                displayBuild(build, !!token);
                loadComments();
            },
            error: function(xhr) {
                console.error('Error loading build:', xhr);
                $('#buildDetail').html('<div class="alert alert-danger">Error loading build: ' + (xhr.responseJSON?.message || xhr.statusText) + '</div>');
            }
        });
    }

    function displayBuild(build, isLoggedIn) {
        const isOwnerFlag = isLoggedIn && isOwner(build.owner?.email);
        const previewUrl = build.preview && build.preview !== 'null' && build.preview !== ''
            ? build.preview
            : 'https://via.placeholder.com/400x300?text=No+Image';

        const categoryIcons = {
            'BLOOD': '🩸', 'FROST': '❄️', 'POISON': '☠️', 'RED_ROT': '🦠',
            'MAGIC': '✨', 'FIRE': '🔥', 'PHYSICAL': '⚔️', 'NOT': '❓'
        };
        const categoryIcon = categoryIcons[build.damageCategory] || '❓';
        const categoryName = build.damageCategory || 'NOT';

        const weaponClassNames = {
            'KATANA': '⚔️ Катана', 'GREAT_SWORD': '🗡️ Великий меч', 'COLOSSAL_SWORD': '⚔️ Колоссальный меч',
            'STRAIGHT_SWORD': '⚔️ Прямой меч', 'DAGGER': '🔪 Кинжал', 'SPEAR': '🏹 Копье',
            'HALBERD': '🪓 Алебарда', 'HAMMER': '🔨 Молот', 'AXE': '🪓 Топор',
            'TWINBLADE': '🌀 Двойной клинок', 'WHIP': '⛓️ Хлыст', 'BOW': '🏹 Лук',
            'GLINTSTONE_STAFF': '🔮 Посох', 'SACRED_SEAL': '✨ Печать'
        };
        const weaponClassDisplay = build.weaponClass && build.weaponClass !== 'NOT'
            ? `<span class="weapon-badge">${weaponClassNames[build.weaponClass] || build.weaponClass}</span>`
            : '';

        const scalingHtml = renderScaling(build);
        const guideHtml = renderGuideContent(build.guideContent);
        const likedClass = build.likedByCurrentUser ? 'liked' : '';
        const likeIcon = build.likedByCurrentUser ? '❤️' : '🤍';
        const likeCount = build.likesCount || 0;
        const editButton = isOwnerFlag ? `<div class="text-center"><a href="/build-editor/${build.id}" class="btn btn-edit"><i class="fas fa-edit"></i> Edit Guide</a></div>` : '';

        const html = `
        <div class="row">
            <div class="col-md-4">
                <div class="build-preview">
                    <button class="like-btn ${likedClass}" onclick="toggleLike()">
                        ${likeIcon} <span class="like-count">${likeCount}</span>
                    </button>
                    <img src="${previewUrl}" alt="${escapeHtml(build.name)}" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                    <h3 style="color: #ffd700;">${escapeHtml(build.name) || 'Unnamed'}</h3>
                    <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                        <span class="category-badge">${categoryIcon} ${categoryName}</span>
                        ${weaponClassDisplay}
                    </div>
                    <p><strong>Description:</strong><br>${escapeHtml(build.description) || 'No description'}</p>
                    <h5 style="color: #ffd700; margin-top: 20px;">📊 Scaling</h5>
                    ${scalingHtml}
                    <h5 style="color: #ffd700; margin-top: 20px;">⚔️ Equipment</h5>
                    <ul class="stats-list">
                        <li><strong>Right Weapon:</strong> ${escapeHtml(build.right) || '-'}</li>
                        <li><strong>Left Weapon:</strong> ${escapeHtml(build.left) || '-'}</li>
                        <li><strong>Right Ash of War:</strong> ${escapeHtml(build.rightAsh) || '-'}</li>
                        <li><strong>Left Ash of War:</strong> ${escapeHtml(build.leftAsh) || '-'}</li>
                        <li><strong>Helmet:</strong> ${escapeHtml(build.helmet) || '-'}</li>
                        <li><strong>Armor:</strong> ${escapeHtml(build.armor) || '-'}</li>
                        <li><strong>Gloves:</strong> ${escapeHtml(build.gloves) || '-'}</li>
                        <li><strong>Trousers:</strong> ${escapeHtml(build.trousers) || '-'}</li>
                    </ul>
                    <div class="author mt-3"><small>by ${escapeHtml(build.owner?.email) || 'Unknown'}</small></div>
                    ${editButton}
                </div>
            </div>
            <div class="col-md-8">
                <div class="guide-section">
                    <h2 style="color: #ffd700; margin-bottom: 20px;"><i class="fas fa-scroll"></i> Build Guide</h2>
                    ${guideHtml}
                </div>
            </div>
        </div>
        `;
        $('#buildDetail').html(html);
    }

    $(document).ready(function() {
        console.log('Document ready, loading build...');
        loadBuild();
    });
</script>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="background: #1a1a2e; color: #eee;">
            <div class="modal-header">
                <h5 class="modal-title" style="color: #ffd700;">Login</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Email">
                <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password">
                <div id="loginMessage" class="alert" style="display:none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="login()">Login</button>
            </div>
        </div>
    </div>
</div>

<script>
    function login() {
        const email = $('#loginEmail').val();
        const password = $('#loginPassword').val();

        $.ajax({
            url: API_URL + '/api/auth/login',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({email, password}),
            success: function(response) {
                if (response.accessToken) {
                    localStorage.setItem('accessToken', response.accessToken);
                    localStorage.setItem('userEmail', email);
                    const expiry = new Date();
                    expiry.setHours(expiry.getHours() + 24);
                    localStorage.setItem('tokenExpiry', expiry.getTime());
                    $('#loginModal').modal('hide');
                    location.reload();
                }
            },
            error: function(xhr) {
                $('#loginMessage').removeClass('alert-success').addClass('alert-danger').text('Login failed: ' + (xhr.responseJSON?.message || xhr.responseText)).show();
            }
        });
    }
</script>
</body>
</html>
