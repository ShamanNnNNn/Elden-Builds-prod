spring.application.name=demo8
spring.docker.compose.enabled=false

server.port=9090

logging.level.com.example.demo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.jmx.enabled=false
spring.jmx.default-domain=disabled
spring.application.admin.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration
# H2 Database - ???????? ?????
spring.datasource.url=jdbc:h2:file:./data/taskdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security (?? ?????????!)
spring.security.user.name=admin
spring.security.user.password=admin
# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000
spring.main.allow-bean-definition-overriding=true
spring.security.enabled=false

logging.level.org.springframework.security=DEBUG

# ???????????? ?????? ?????
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB